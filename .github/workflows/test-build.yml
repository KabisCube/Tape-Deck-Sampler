# Builds a test APK from the latest commit on a branch (main by default) without making a release:
# no tag, no version bump, nothing published. Start it from GitHub > Actions > Test build > Run workflow,
# or with `gh workflow run test-build.yml`. The APK is attached to the run as an artifact for 14 days.
name: Test build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Run unit tests
        run: bash tools/build.sh --test-only

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Signed with the release key, the test APK installs over the release app without losing data.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing, so this APK is signed with a debug key and can't update the release app."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing/keystore.properties

      - name: Build release APK
        run: bash ./gradlew --no-daemon --console plain :app:assembleRelease

      - name: Name the APK after the commit
        run: |
          version=$(sed -n "s/^\s*versionName '\(.*\)'.*/\1/p" app/build.gradle | tr -d '\r')
          name="TapeDeckSampler-$version-test-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}.apk
          retention-days: 14
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f signing/release.jks signing/keystore.properties
