# Builds the signed release APK for every pushed vX.Y.Z tag and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches build.gradle
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n "s/^\s*versionName '\(.*\)'/\1/p" app/build.gradle)
          code=$(sed -n 's/^\s*versionCode \([0-9]*\)/\1/p' app/build.gradle)
          if [ "$version" != "$declared" ]; then echo "Tag $GITHUB_REF_NAME does not match versionName $declared"; exit 1; fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -s "$changelog" ]; then echo "Missing $changelog"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CHANGELOG=$changelog" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing. See README > Releasing."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing/keystore.properties

      - name: Build release APK
        run: bash ./gradlew --no-daemon --console plain :app:assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="TapeDeckSampler-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          prerelease=""
          if [ "${VERSION%%.*}" = "0" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Tape Deck Sampler $GITHUB_REF_NAME" --notes-file "$CHANGELOG" $prerelease

      - name: Remove signing key
        if: always()
        run: rm -f signing/release.jks signing/keystore.properties
